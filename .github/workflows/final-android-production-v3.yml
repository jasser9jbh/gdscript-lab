name: GDScript Lab Android final production v3

on:
  push:
    branches: [uiux-native-final-run-20260902]
    paths:
      - '.github/workflows/final-android-production-v3.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SOURCE_ARTIFACT_ID: '9849014748'
  PROJECT_DIR: GDScript_Lab_Tauri_v1.0.0
  EXPECTED_FRONTEND_SHA256: 628151d40b067f8ab55da80030862720d319d07f69d62d5b532bfd0fdc311336
  EXPECTED_PORTABLE_SHA256: e9961e8ed86526cff1a51725dd013c4370a159754642f3c6628779202095108d
  EXPECTED_COURSE_SHA256: c0a663fb0cf5cf8876e3279e70d5783d245a615cbf6238cf82a1ad67e1408abe

jobs:
  android:
    name: Build sign and validate Android release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }

      - name: Download exact normalized source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            -o source-artifact.zip
          python -m zipfile -e source-artifact.zip source-wrapper
          python -m zipfile -e source-wrapper/GDScript_Lab_v1.0.0_FINAL_PRODUCTION_SOURCE.zip .
          test "$(sha256sum "$PROJECT_DIR/src/index.html" | awk '{print $1}')" = "$EXPECTED_FRONTEND_SHA256"
          test "$(sha256sum "$PROJECT_DIR/portable/GDScript_Lab_Godot47_v1.0.0.html" | awk '{print $1}')" = "$EXPECTED_PORTABLE_SHA256"
          cd "$PROJECT_DIR"
          python scripts/no_unicode_dashes_check.py
          python scripts/audit.py

      - uses: actions/setup-node@v4
        with: { node-version: '22.16.0' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3

      - name: Install Android build SDK and NDK only
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          df -h

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.0'
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './GDScript_Lab_Tauri_v1.0.0/src-tauri -> target'

      - name: Build canonical APK and AAB
        working-directory: GDScript_Lab_Tauri_v1.0.0
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run icons
          python scripts/audit.py
          cargo metadata --locked --format-version 1 --manifest-path src-tauri/Cargo.toml >/dev/null
          npm run android:init
          npm run android:apk
          npm run android:aab
          df -h

      - name: Sign permanent v1.0.0 release identity
        working-directory: GDScript_Lab_Tauri_v1.0.0
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          OUT="$RUNNER_TEMP/android-release"
          PRIV="$RUNNER_TEMP/android-private"
          mkdir -p "$OUT" "$PRIV"
          PASS="$(openssl rand -hex 32)"
          ALIAS='gdlab-release'
          KS="$PRIV/GDScript_Lab_Android_Release_Keystore.jks"
          keytool -genkeypair -keystore "$KS" -storepass "$PASS" -keypass "$PASS" -alias "$ALIAS" -keyalg RSA -keysize 3072 -sigalg SHA256withRSA -validity 10000 -dname 'CN=GDScript Lab, O=Journey Beyond Horizons Productions (JBH PRODS)' >/dev/null 2>&1
          U="$(find src-tauri/gen/android/app/build/outputs -type f -name '*release-unsigned.apk' -print -quit)"
          A="$(find src-tauri/gen/android/app/build/outputs -type f -name '*.aab' -print -quit)"
          test -n "$U"
          test -n "$A"
          "$BT/zipalign" -f -p 4 "$U" "$OUT/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$ALIAS" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out "$OUT/GDScript_Lab_v1.0.0_Android.apk" "$OUT/aligned.apk"
          rm "$OUT/aligned.apk"
          cp "$A" "$OUT/GDScript_Lab_v1.0.0_Android.aab"
          jarsigner -keystore "$KS" -storepass "$PASS" -keypass "$PASS" -sigalg SHA256withRSA -digestalg SHA-256 "$OUT/GDScript_Lab_v1.0.0_Android.aab" "$ALIAS" >/dev/null
          "$BT/apksigner" verify --verbose --print-certs "$OUT/GDScript_Lab_v1.0.0_Android.apk" | tee "$OUT/APK_SIGNATURE_VERIFICATION.txt"
          jarsigner -verify -verbose -certs "$OUT/GDScript_Lab_v1.0.0_Android.aab" 2>&1 | tee "$OUT/AAB_SIGNATURE_VERIFICATION.txt"
          grep -q 'jar verified' "$OUT/AAB_SIGNATURE_VERIFICATION.txt"
          "$BT/zipalign" -c -v 4 "$OUT/GDScript_Lab_v1.0.0_Android.apk" > "$OUT/APK_ZIPALIGN_VERIFICATION.txt"
          "$BT/aapt" dump badging "$OUT/GDScript_Lab_v1.0.0_Android.apk" > "$OUT/APK_BADGING.txt"
          CERT="$($BT/apksigner verify --print-certs "$OUT/GDScript_Lab_v1.0.0_Android.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          keytool -exportcert -rfc -keystore "$KS" -storepass "$PASS" -alias "$ALIAS" > "$OUT/ANDROID_RELEASE_CERTIFICATE.pem"
          cat > "$OUT/ANDROID_RELEASE_IDENTITY.txt" <<EOF
          GDScript Lab v1.0.0 Android release signing identity
          Certificate SHA-256: $CERT
          Alias: $ALIAS
          This is the permanent replacement identity for the public v1.0.0 release.
          Earlier prerelease APKs signed by certificate 390ef4409a8b6bb7dd99e1ce7e14eb57a46b60aa557101b2ffd4f1fbb7a63064 cannot be updated in place by this release.
          EOF
          cat > "$PRIV/ANDROID_SIGNING_CREDENTIALS.txt" <<EOF
          PRIVATE. STORE SECURELY. DO NOT DISTRIBUTE.
          Product: GDScript Lab
          Alias: $ALIAS
          Keystore password: $PASS
          Key password: $PASS
          Certificate SHA-256: $CERT
          This keystore is the permanent Android signing identity for public v1.0.0 and future direct signed updates.
          EOF
          cp "$OUT/ANDROID_RELEASE_IDENTITY.txt" "$PRIV/ANDROID_RELEASE_IDENTITY.txt"
          cp "$OUT/ANDROID_RELEASE_CERTIFICATE.pem" "$PRIV/ANDROID_RELEASE_CERTIFICATE.pem"
          sha256sum "$OUT"/*.apk "$OUT"/*.aab > "$OUT/SHA256SUMS.txt"

      - name: Upload signed release before emulator validation
        uses: actions/upload-artifact@v4
        with:
          name: GDScript-Lab-v1.0.0-V3-Android-signed
          path: ${{ runner.temp }}/android-release/**
          if-no-files-found: error
          retention-days: 90

      - name: Upload permanent signing backup before emulator validation
        uses: actions/upload-artifact@v4
        with:
          name: PRIVATE-GDScript-Lab-v1.0.0-V3-Android-signing-backup
          path: ${{ runner.temp }}/android-private/**
          if-no-files-found: error
          retention-days: 90

      - name: Free build space before emulator installation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PROJECT_DIR/node_modules" "$PROJECT_DIR/src-tauri/target" "$PROJECT_DIR/src-tauri/gen/android/app/build"
          sudo rm -rf /usr/local/lib/android/sdk/ndk/25.* /usr/local/lib/android/sdk/ndk/26.* 2>/dev/null || true
          df -h

      - name: Install Android 35 emulator image
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'emulator' 'system-images;android-35;google_apis;x86_64'
          df -h

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Launch signed APK on Android 35 and validate runtime
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/android-release"
          E="$OUT/runtime-evidence"
          mkdir -p "$E"
          APK="$OUT/GDScript_Lab_v1.0.0_Android.apk"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          PACKAGE="$($BT/aapt dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          ACTIVITY="$($BT/aapt dump badging "$APK" | sed -n "s/^launchable-activity: name='\([^']*\)'.*/\1/p" | head -1)"
          test "$PACKAGE" = 'com.jbhprods.gdscriptlab'
          test -n "$ACTIVITY"
          printf 'package=%s\nactivity=%s\n' "$PACKAGE" "$ACTIVITY" > "$E/ANDROID_LAUNCH_TARGET.txt"
          echo no | avdmanager create avd --force --name gdlab_api35 --package 'system-images;android-35;google_apis;x86_64' --device 'pixel_6' > "$E/AVD_CREATE.txt" 2>&1
          "$ANDROID_HOME/emulator/emulator" -avd gdlab_api35 -no-window -noaudio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -no-metrics > "$E/EMULATOR_STDOUT.txt" 2>&1 &
          EMU_PID=$!
          cleanup(){ kill "$EMU_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          adb wait-for-device
          BOOT=''
          for i in $(seq 1 240); do
            BOOT="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            [ "$BOOT" = '1' ] && break
            sleep 2
          done
          [ "$BOOT" = '1' ] || { cat "$E/EMULATOR_STDOUT.txt"; exit 1; }
          adb install -r "$APK" | tee "$E/ADB_INSTALL.txt"
          adb logcat -c
          adb shell am start -W -n "$PACKAGE/$ACTIVITY" | tee "$E/ADB_START.txt"
          sleep 20
          PID="$(adb shell pidof "$PACKAGE" | tr -d '\r\n')"
          printf '%s\n' "$PID" > "$E/PID.txt"
          adb shell dumpsys activity activities > "$E/DUMPSYS_ACTIVITIES.txt" || true
          adb shell dumpsys activity exit-info "$PACKAGE" > "$E/EXIT_INFO.txt" || true
          adb shell dumpsys window windows > "$E/DUMPSYS_WINDOWS.txt" || true
          adb logcat -d -t 2000 > "$E/ANDROID_RUNTIME_LOGCAT.txt" || true
          adb exec-out screencap -p > "$E/ANDROID_RUNTIME_SCREENSHOT.png" || true
          test -n "$PID"
          grep -q "$PACKAGE" "$E/DUMPSYS_ACTIVITIES.txt"
          if grep -E "Process: ${PACKAGE}|FATAL EXCEPTION" "$E/ANDROID_RUNTIME_LOGCAT.txt" | grep -q "$PACKAGE"; then
            echo 'Package specific fatal runtime signature detected' >&2
            exit 1
          fi
          printf 'PASS: Android process remained alive. Package=%s PID=%s\n' "$PACKAGE" "$PID" | tee "$E/RESULT.txt"

      - name: Upload final Android runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GDScript-Lab-v1.0.0-V3-Android-runtime-evidence
          path: ${{ runner.temp }}/android-release/runtime-evidence/**
          if-no-files-found: warn
          retention-days: 90
