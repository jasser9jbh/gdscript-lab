name: GDScript Lab corrected metadata definitive rebuild

on:
  push:
    branches: [uiux-native-final-run-20260902]
    paths:
      - '.github/workflows/final-corrected-metadata-rebuild.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gdlab-corrected-metadata-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_ARTIFACT_ID: '9849014748'
  PROJECT_DIR: GDScript_Lab_Tauri_v1.0.0
  EXPECTED_FRONTEND_SHA256: 628151d40b067f8ab55da80030862720d319d07f69d62d5b532bfd0fdc311336
  EXPECTED_PORTABLE_SHA256: e9961e8ed86526cff1a51725dd013c4370a159754642f3c6628779202095108d
  EXPECTED_COURSE_SHA256: c0a663fb0cf5cf8876e3279e70d5783d245a615cbf6238cf82a1ad67e1408abe
  EXPECTED_TAURI_CONF_SHA256: 34b6a822c11d94c0048565ff607917a9e3d653921386ba66651bab8cb41587c0
  EXPECTED_DASH_CHECK_SHA256: 36d88f66d8ab3f4d5412dc92954e1b1a106e9a21084728949e49659e30da431e

jobs:
  source:
    name: Freeze corrected source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Download and correct exact normalized source
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" -o source-artifact.zip
          python -m zipfile -e source-artifact.zip source-wrapper
          python -m zipfile -e source-wrapper/GDScript_Lab_v1.0.0_FINAL_PRODUCTION_SOURCE.zip .
          python - <<'PY'
          from pathlib import Path
          p=Path('GDScript_Lab_Tauri_v1.0.0/src-tauri/tauri.conf.json')
          s=p.read_text('utf-8')
          old=r'\u00a9 2025\u20132026 Journey Beyond Horizons Productions (JBH PRODS). All rights reserved.'
          new=r'\u00a9 2025 to 2026 Journey Beyond Horizons Productions (JBH PRODS). All rights reserved.'
          if old not in s:
              raise SystemExit('Expected old escaped copyright form not found')
          p.write_text(s.replace(old,new,1),'utf-8')
          checker=Path('GDScript_Lab_Tauri_v1.0.0/scripts/no_unicode_dashes_check.py')
          checker.write_text("""from pathlib import Path\n\nBAD_LITERAL = '\\u2010\\u2011\\u2012\\u2013\\u2014\\u2015\\u2212'\nBAD_ESCAPES = tuple('\\\\u' + f'{ord(ch):04x}' for ch in BAD_LITERAL) + tuple('\\\\u' + f'{ord(ch):04X}' for ch in BAD_LITERAL)\nTEXT_SUFFIXES = {'.html', '.htm', '.json', '.md', '.txt', '.toml', '.yml', '.yaml', '.css', '.js', '.ts', '.tsx', '.jsx', '.xml'}\n\nroot = Path(__file__).resolve().parents[1]\nhits = []\nfor path in root.rglob('*'):\n    if not path.is_file() or path.suffix.lower() not in TEXT_SUFFIXES:\n        continue\n    try:\n        text = path.read_text('utf-8')\n    except (UnicodeDecodeError, OSError):\n        continue\n    reasons = []\n    if any(ch in text for ch in BAD_LITERAL):\n        reasons.append('literal')\n    if any(seq in text for seq in BAD_ESCAPES):\n        reasons.append('escaped')\n    if reasons:\n        hits.append(f\"{path.relative_to(root)} ({'+'.join(reasons)})\")\n\nif hits:\n    raise SystemExit('Unicode dash punctuation found: ' + ', '.join(hits))\nprint('PASS: zero literal or escaped Unicode dash punctuation in content/config text files')\n""",'utf-8')
          PY
          test "$(sha256sum "$PROJECT_DIR/src/index.html" | awk '{print $1}')" = "$EXPECTED_FRONTEND_SHA256"
          test "$(sha256sum "$PROJECT_DIR/portable/GDScript_Lab_Godot47_v1.0.0.html" | awk '{print $1}')" = "$EXPECTED_PORTABLE_SHA256"
          test "$(sha256sum "$PROJECT_DIR/src-tauri/tauri.conf.json" | awk '{print $1}')" = "$EXPECTED_TAURI_CONF_SHA256"
          test "$(sha256sum "$PROJECT_DIR/scripts/no_unicode_dashes_check.py" | awk '{print $1}')" = "$EXPECTED_DASH_CHECK_SHA256"
          cd "$PROJECT_DIR"
          python scripts/no_unicode_dashes_check.py
          python scripts/audit.py | tee ../SOURCE_AUDIT.txt
          grep -q "$EXPECTED_COURSE_SHA256" ../SOURCE_AUDIT.txt
          cd ..
          python -m zipfile -c GDScript_Lab_v1.0.0_CORRECTED_NATIVE_SOURCE.zip "$PROJECT_DIR"
          sha256sum GDScript_Lab_v1.0.0_CORRECTED_NATIVE_SOURCE.zip > SOURCE_ZIP_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GDScript-Lab-v1.0.0-CORRECTED-source
          path: |
            GDScript_Lab_v1.0.0_CORRECTED_NATIVE_SOURCE.zip
            SOURCE_AUDIT.txt
            SOURCE_ZIP_SHA256.txt
          if-no-files-found: error
          retention-days: 90

  desktop:
    name: ${{ matrix.name }}
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'Linux x64 AppImage and DEB', os: ubuntu-latest, target: '', bundles: 'appimage,deb', kind: 'Linux' }
          - { name: 'Windows x64 NSIS and MSI', os: windows-latest, target: '', bundles: 'nsis,msi', kind: 'Windows' }
          - { name: 'macOS Apple Silicon APP and DMG', os: macos-latest, target: 'aarch64-apple-darwin', bundles: 'app,dmg', kind: 'macOS-arm64' }
          - { name: 'macOS Intel APP and DMG', os: macos-latest, target: 'x86_64-apple-darwin', bundles: 'app,dmg', kind: 'macOS-x64' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: 'GDScript-Lab-v1.0.0-CORRECTED-source' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Extract and verify corrected source
        shell: bash
        run: |
          set -euo pipefail
          python -m zipfile -e GDScript_Lab_v1.0.0_CORRECTED_NATIVE_SOURCE.zip .
          test "$(sha256sum "$PROJECT_DIR/src/index.html" | awk '{print $1}')" = "$EXPECTED_FRONTEND_SHA256"
          test "$(sha256sum "$PROJECT_DIR/portable/GDScript_Lab_Godot47_v1.0.0.html" | awk '{print $1}')" = "$EXPECTED_PORTABLE_SHA256"
          test "$(sha256sum "$PROJECT_DIR/src-tauri/tauri.conf.json" | awk '{print $1}')" = "$EXPECTED_TAURI_CONF_SHA256"
          cd "$PROJECT_DIR" && python scripts/no_unicode_dashes_check.py && python scripts/audit.py
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils xvfb
      - uses: actions/setup-node@v4
        with: { node-version: '22.16.0' }
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: '1.98.0' }
      - name: Add target
        if: matrix.target != ''
        shell: bash
        run: rustup target add '${{ matrix.target }}'
      - uses: swatinem/rust-cache@v2
        with: { workspaces: './GDScript_Lab_Tauri_v1.0.0/src-tauri -> target' }
      - name: Build locked bundles
        working-directory: GDScript_Lab_Tauri_v1.0.0
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run icons
          python scripts/no_unicode_dashes_check.py
          python scripts/audit.py
          cargo metadata --locked --format-version 1 --manifest-path src-tauri/Cargo.toml >/dev/null
          if [ -n '${{ matrix.target }}' ]; then npm run tauri -- build --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}'; else npm run tauri -- build --bundles '${{ matrix.bundles }}'; fi
      - name: Linux GUI smoke
        if: runner.os == 'Linux'
        working-directory: GDScript_Lab_Tauri_v1.0.0
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find src-tauri/target -type f -name '*.AppImage' -print -quit)"; test -n "$APP"; chmod +x "$APP"
          set +e
          xvfb-run -a env APPIMAGE_EXTRACT_AND_RUN=1 "$APP" > "$RUNNER_TEMP/linux-smoke.log" 2>&1 & PID=$!
          sleep 10
          if kill -0 "$PID" 2>/dev/null; then kill "$PID" || true; wait "$PID" || true; echo 'PASS: Linux GUI smoke' | tee "$RUNNER_TEMP/GUI_EVIDENCE.txt"; exit 0; fi
          wait "$PID"; C=$?; cat "$RUNNER_TEMP/linux-smoke.log" || true; exit "$C"
      - name: Windows GUI smoke
        if: runner.os == 'Windows'
        working-directory: GDScript_Lab_Tauri_v1.0.0
        shell: pwsh
        run: |
          $exe=Get-ChildItem src-tauri/target -Recurse -Filter '*.exe' | Where-Object { $_.FullName -match '\\release\\gdscript-lab\.exe$' } | Select-Object -First 1
          if (-not $exe) { throw 'Application executable not found' }
          $p=Start-Process $exe.FullName -PassThru; Start-Sleep 10
          if ($p.HasExited) { throw "Application exited with $($p.ExitCode)" }
          Stop-Process $p.Id -Force
          'PASS: Windows GUI smoke' | Set-Content "$env:RUNNER_TEMP/GUI_EVIDENCE.txt"
      - name: Stage distributables
        shell: bash
        working-directory: GDScript_Lab_Tauri_v1.0.0
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/release"; mkdir -p "$OUT"
          case '${{ matrix.kind }}' in
            Linux)
              cp "$(find src-tauri/target -type f -name '*.AppImage' -print -quit)" "$OUT/GDScript_Lab_v1.0.0_Linux_x64.AppImage"
              cp "$(find src-tauri/target -type f -name '*.deb' -print -quit)" "$OUT/GDScript_Lab_v1.0.0_Linux_x64.deb"
              cp "$RUNNER_TEMP/GUI_EVIDENCE.txt" "$OUT/GUI_EVIDENCE.txt";;
            Windows)
              cp "$(find src-tauri/target -type f -path '*/bundle/nsis/*.exe' -print -quit)" "$OUT/GDScript_Lab_v1.0.0_Windows_x64_Setup.exe"
              cp "$(find src-tauri/target -type f -path '*/bundle/msi/*.msi' -print -quit)" "$OUT/GDScript_Lab_v1.0.0_Windows_x64.msi"
              cp "$RUNNER_TEMP/GUI_EVIDENCE.txt" "$OUT/GUI_EVIDENCE.txt";;
            macOS-arm64) cp "$(find src-tauri/target -type f -path '*/bundle/dmg/*.dmg' -print -quit)" "$OUT/GDScript_Lab_v1.0.0_macOS_AppleSilicon.dmg";;
            macOS-x64) cp "$(find src-tauri/target -type f -path '*/bundle/dmg/*.dmg' -print -quit)" "$OUT/GDScript_Lab_v1.0.0_macOS_Intel.dmg";;
          esac
          sha256sum "$OUT"/* > "$OUT/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: GDScript-Lab-v1.0.0-CORRECTED-${{ matrix.kind }}
          path: ${{ runner.temp }}/release/**
          if-no-files-found: error
          retention-days: 90

  ios:
    name: iOS unsigned compile validation
    needs: source
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: 'GDScript-Lab-v1.0.0-CORRECTED-source' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: python -m zipfile -e GDScript_Lab_v1.0.0_CORRECTED_NATIVE_SOURCE.zip .
      - uses: actions/setup-node@v4
        with: { node-version: '22.16.0' }
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: '1.98.0', targets: 'aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim' }
      - run: brew install cocoapods
      - name: Compile unsigned iOS app
        working-directory: GDScript_Lab_Tauri_v1.0.0
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum src-tauri/tauri.conf.json | awk '{print $1}')" = "$EXPECTED_TAURI_CONF_SHA256"
          npm ci
          npm run icons
          python scripts/no_unicode_dashes_check.py
          python scripts/audit.py
          cargo metadata --locked --format-version 1 --manifest-path src-tauri/Cargo.toml >/dev/null
          npm run ios:init
          npm run ios:build
          printf '%s\n' 'PASS: iOS unsigned compile completed from corrected metadata source.' 'A distributable IPA requires Apple signing/provisioning credentials.' > "$RUNNER_TEMP/IOS_COMPILE_VALIDATION.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: GDScript-Lab-v1.0.0-CORRECTED-iOS-validation
          path: ${{ runner.temp }}/IOS_COMPILE_VALIDATION.txt
          retention-days: 90

  android:
    name: Android signed release and Android 35 runtime
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: 'GDScript-Lab-v1.0.0-CORRECTED-source' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: python -m zipfile -e GDScript_Lab_v1.0.0_CORRECTED_NATIVE_SOURCE.zip .
      - uses: actions/setup-node@v4
        with: { node-version: '22.16.0' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install build SDK and NDK only
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: '1.98.0', targets: 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android' }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: './GDScript_Lab_Tauri_v1.0.0/src-tauri -> target' }
      - name: Build APK and AAB
        working-directory: GDScript_Lab_Tauri_v1.0.0
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum src-tauri/tauri.conf.json | awk '{print $1}')" = "$EXPECTED_TAURI_CONF_SHA256"
          npm ci
          npm run icons
          python scripts/no_unicode_dashes_check.py
          python scripts/audit.py
          cargo metadata --locked --format-version 1 --manifest-path src-tauri/Cargo.toml >/dev/null
          npm run android:init
          npm run android:apk
          npm run android:aab
      - name: Create permanent replacement signer and sign release
        working-directory: GDScript_Lab_Tauri_v1.0.0
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"; OUT="$RUNNER_TEMP/android-public"; PRIV="$RUNNER_TEMP/android-private"; mkdir -p "$OUT" "$PRIV"
          PASS="$(openssl rand -hex 32)"; ALIAS='gdlab-release'; KS="$PRIV/GDScript_Lab_Android_Release_Keystore.jks"
          keytool -genkeypair -keystore "$KS" -storepass "$PASS" -keypass "$PASS" -alias "$ALIAS" -keyalg RSA -keysize 3072 -sigalg SHA256withRSA -validity 10000 -dname 'CN=GDScript Lab, O=Journey Beyond Horizons Productions (JBH PRODS)' >/dev/null 2>&1
          U="$(find src-tauri/gen/android/app/build/outputs -type f -name '*release-unsigned.apk' -print -quit)"; A="$(find src-tauri/gen/android/app/build/outputs -type f -name '*.aab' -print -quit)"; test -n "$U"; test -n "$A"
          "$BT/zipalign" -f -p 4 "$U" "$OUT/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$ALIAS" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out "$OUT/GDScript_Lab_v1.0.0_Android.apk" "$OUT/aligned.apk"
          rm "$OUT/aligned.apk"
          cp "$A" "$OUT/GDScript_Lab_v1.0.0_Android.aab"
          jarsigner -keystore "$KS" -storepass "$PASS" -keypass "$PASS" -sigalg SHA256withRSA -digestalg SHA-256 "$OUT/GDScript_Lab_v1.0.0_Android.aab" "$ALIAS" >/dev/null
          "$BT/apksigner" verify --verbose --print-certs "$OUT/GDScript_Lab_v1.0.0_Android.apk" | tee "$OUT/APK_SIGNATURE_VERIFICATION.txt"
          jarsigner -verify -verbose -certs "$OUT/GDScript_Lab_v1.0.0_Android.aab" 2>&1 | tee "$OUT/AAB_SIGNATURE_VERIFICATION.txt"
          grep -q 'jar verified' "$OUT/AAB_SIGNATURE_VERIFICATION.txt"
          "$BT/zipalign" -c -v 4 "$OUT/GDScript_Lab_v1.0.0_Android.apk" > "$OUT/APK_ZIPALIGN_VERIFICATION.txt"
          "$BT/aapt" dump badging "$OUT/GDScript_Lab_v1.0.0_Android.apk" > "$OUT/APK_BADGING.txt"
          keytool -exportcert -rfc -keystore "$KS" -storepass "$PASS" -alias "$ALIAS" > "$OUT/GDScript_Lab_Android_Release_Certificate.pem"
          CERT="$($BT/apksigner verify --print-certs "$OUT/GDScript_Lab_v1.0.0_Android.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          printf '%s\n' "Certificate SHA-256: $CERT" 'Signer status: permanent replacement identity established for this v1.0.0 release.' 'Compatibility note: this identity cannot update APKs signed by the missing earlier private key.' > "$OUT/ANDROID_RELEASE_IDENTITY.txt"
          printf '%s\n' "keystore_password=$PASS" "key_password=$PASS" "alias=$ALIAS" "certificate_sha256=$CERT" > "$PRIV/ANDROID_SIGNING_CREDENTIALS.txt"
          sha256sum "$OUT"/* > "$OUT/SHA256SUMS.txt"
      - name: Upload public signed Android release before runtime test
        uses: actions/upload-artifact@v4
        with:
          name: GDScript-Lab-v1.0.0-CORRECTED-Android-signed
          path: ${{ runner.temp }}/android-public/**
          if-no-files-found: error
          retention-days: 90
      - name: Upload private signing backup separately
        uses: actions/upload-artifact@v4
        with:
          name: GDScript-Lab-v1.0.0-PRIVATE-Android-signing-backup
          path: ${{ runner.temp }}/android-private/**
          if-no-files-found: error
          retention-days: 90
      - name: Reclaim build space and install Android 35 emulator
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PROJECT_DIR/src-tauri/target" "$PROJECT_DIR/src-tauri/gen/android/app/build/intermediates" || true
          sdkmanager 'emulator' 'system-images;android-35;google_apis;x86_64'
          echo no | avdmanager create avd --force --name gdlab35 --package 'system-images;android-35;google_apis;x86_64' --device pixel_6
      - name: Launch exact signed APK on Android 35
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_ADB_SERVER_PORT=5037
          nohup "$ANDROID_HOME/emulator/emulator" -avd gdlab35 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 5; done'
          APK="$RUNNER_TEMP/android-public/GDScript_Lab_v1.0.0_Android.apk"
          adb install -r "$APK"
          PKG="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" "$RUNNER_TEMP/android-public/APK_BADGING.txt" | head -1)"; test -n "$PKG"
          adb logcat -c
          adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1
          sleep 12
          PID="$(adb shell pidof "$PKG" | tr -d '\r')"; test -n "$PID"
          adb shell dumpsys activity activities > "$RUNNER_TEMP/ANDROID_ACTIVITY_STATE.txt"
          adb logcat -d > "$RUNNER_TEMP/ANDROID_LOGCAT.txt"
          adb exec-out screencap -p > "$RUNNER_TEMP/ANDROID_RUNTIME_SCREENSHOT.png"
          if grep -E "FATAL EXCEPTION|Process: $PKG|AndroidRuntime.*$PKG" "$RUNNER_TEMP/ANDROID_LOGCAT.txt"; then exit 1; fi
          printf '%s\n' 'PASS: exact signed APK installed and remained alive on Android 35 emulator.' "Package: $PKG" "PID: $PID" > "$RUNNER_TEMP/ANDROID_RUNTIME_VALIDATION.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: GDScript-Lab-v1.0.0-CORRECTED-Android-runtime-evidence
          path: |
            ${{ runner.temp }}/ANDROID_RUNTIME_VALIDATION.txt
            ${{ runner.temp }}/ANDROID_ACTIVITY_STATE.txt
            ${{ runner.temp }}/ANDROID_LOGCAT.txt
            ${{ runner.temp }}/ANDROID_RUNTIME_SCREENSHOT.png
            ${{ runner.temp }}/emulator.log
          if-no-files-found: error
          retention-days: 90
