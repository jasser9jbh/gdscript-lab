name: Repair final signed release workflow

on:
  push:
    branches:
      - release/public-preflight-20260902
    paths:
      - '.github/workflows/repair-final-signed-release.yml'
      - '.github/repair_final_workflow.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/public-preflight-20260902
      - name: Apply hardened final release workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/repair_final_workflow.py
          echo '--- generated workflow lines 65-100 ---'
          nl -ba .github/workflows/final-signed-release.yml | sed -n '65,100p'
          python3 - <<'PY'
          import yaml
          with open('.github/workflows/final-signed-release.yml', encoding='utf-8') as f:
              yaml.safe_load(f)
          print('PASS: final-signed-release.yml parses as YAML')
          PY
          grep -nE 'pipeline_preflight|SOURCE_RUN_ID|PRODUCTION_SOURCE|macos-15-intel|Import iOS distribution|THIRD_PARTY_LICENSES|Public proprietary source|FINAL VERIFIED' .github/workflows/final-signed-release.yml
      - name: Commit repaired workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/final-signed-release.yml
          git commit -m 'Harden final public release pipeline'
          git push origin HEAD:release/public-preflight-20260902
