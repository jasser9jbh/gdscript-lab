name: Repair final signed release workflow

on:
  push:
    branches:
      - release/public-preflight-20260902
    paths:
      - '.github/workflows/repair-final-signed-release.yml'
      - '.github/repair_final_workflow.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/public-preflight-20260902
      - name: Apply hardened final release workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/repair_final_workflow.py')
          s=p.read_text(encoding='utf-8')
          needle="          printf '%s\\n' 'PASS: source, dependency advisory and third-party license gates are available and verified.'"
          replacement="          printf '%s\\\\n' 'PASS: source, dependency advisory and third-party license gates are available and verified.'"
          if needle not in s:
              raise SystemExit('newline escape repair target not found')
          p.write_text(s.replace(needle,replacement,1), encoding='utf-8')
          PY
          python3 .github/repair_final_workflow.py
          python3 - <<'PY'
          import yaml
          with open('.github/workflows/final-signed-release.yml', encoding='utf-8') as f:
              yaml.safe_load(f)
          print('PASS: final-signed-release.yml parses as YAML')
          PY
          grep -nE 'pipeline_preflight|SOURCE_RUN_ID|PRODUCTION_SOURCE|macos-15-intel|Import iOS distribution|THIRD_PARTY_LICENSES|Public proprietary source|FINAL VERIFIED' .github/workflows/final-signed-release.yml
      - name: Commit repaired workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/final-signed-release.yml
          git commit -m 'Harden final public release pipeline'
          git push origin HEAD:release/public-preflight-20260902
