# Final v1.0.0 reproducibility resolver
name: Resolve final locks and license inventory

on:
  pull_request:
    paths:
      - '.github/workflows/resolve-locks-and-licenses.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_ZIP_SHA256: 59e7c1599c6438d2372c022ad4a18c272b7cc6cc27f016944c6b0626e0a1a761
  PROJECT_DIR: _incoming/GDScript_Lab_Tauri_v1.0.0
  NODE_VERSION: '22.16.0'
  PYTHON_VERSION: '3.13'
  RUST_VERSION: '1.98.0'

jobs:
  resolve:
    name: Resolve package/Cargo locks and Rust licenses
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Verify and unpack frozen production source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name 'GDScript_Lab_v1.0.0_Tauri_Production_Project_FINAL*.zip' -print -quit)"
          test -n "$ZIP"
          ACTUAL="$(sha256sum "$ZIP" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED_ZIP_SHA256"
          rm -rf _incoming && mkdir -p _incoming
          python -m zipfile -e "$ZIP" _incoming
          test -f "$PROJECT_DIR/package.json"
      - name: Resolve npm lockfile
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install --package-lock-only --ignore-scripts
      - name: Resolve corrected Cargo lockfile
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src-tauri/Cargo.toml')
          s=p.read_text('utf-8')
          s=s.replace('tauri-build = { version = "=2.5.6" }','tauri-build = { version = "=2.6.3" }')
          s=s.replace('tauri-plugin-fs = { version = "=2.5.1" }','tauri-plugin-fs = { version = "=2.5.2" }')
          p.write_text(s,'utf-8')
          PY
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          cargo metadata --locked --format-version 1 --manifest-path src-tauri/Cargo.toml > cargo-metadata.json
      - name: Generate Rust dependency license inventory
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.load(open('cargo-metadata.json',encoding='utf-8'))
          root_id=m.get('resolve',{}).get('root')
          rows=[]
          for p in m['packages']:
              if p['id']==root_id:
                  continue
              rows.append({
                  'name':p['name'],
                  'version':p['version'],
                  'license':p.get('license'),
                  'license_file':p.get('license_file'),
                  'repository':p.get('repository'),
                  'source':p.get('source'),
              })
          rows.sort(key=lambda x:(x['name'].lower(),x['version']))
          Path('RUST_DEPENDENCY_LICENSES.json').write_text(json.dumps(rows,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          out=['# GDScript Lab v1.0.0 — Rust Dependency License Inventory','',
               'Generated from `cargo metadata --locked` using the final corrected Cargo manifest and lockfile.','',
               '| Package | Version | License expression | Repository |','|---|---:|---|---|']
          for r in rows:
              lic=r['license'] or ('license file' if r['license_file'] else 'not declared in Cargo metadata')
              repo=r['repository'] or ''
              out.append(f"| `{r['name']}` | `{r['version']}` | {lic} | {repo} |")
          out += ['',f'Packages inventoried: **{len(rows)}**.','',
                  'This inventory records dependency metadata; it does not replace any license text or legal obligations that must accompany a distribution.']
          Path('THIRD_PARTY_RUST_DEPENDENCIES.md').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Verify lockfile consistency
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm ci --ignore-scripts
          cargo metadata --locked --format-version 1 --manifest-path src-tauri/Cargo.toml > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: GDScript-Lab-v1.0.0-locks-and-licenses
          if-no-files-found: error
          path: |
            ${{ env.PROJECT_DIR }}/package-lock.json
            ${{ env.PROJECT_DIR }}/src-tauri/Cargo.lock
            ${{ env.PROJECT_DIR }}/RUST_DEPENDENCY_LICENSES.json
            ${{ env.PROJECT_DIR }}/THIRD_PARTY_RUST_DEPENDENCIES.md
