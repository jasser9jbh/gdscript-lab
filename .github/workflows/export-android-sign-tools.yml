name: Export Android signing tools

on:
  push:
    paths:
      - '.github/workflows/export-android-sign-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android build tools 36.0.0
        run: sdkmanager 'build-tools;36.0.0'
      - name: Stage apksigner and zipalign
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p exported/lib exported/lib64
          cp "$BT/apksigner" exported/
          cp "$BT/zipalign" exported/
          cp "$BT/lib/apksigner.jar" exported/lib/
          cp "$BT/lib64/libc++.so" exported/lib64/
          chmod +x exported/apksigner exported/zipalign
      - uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-signing-36.0.0-linux
          if-no-files-found: error
          path: exported
