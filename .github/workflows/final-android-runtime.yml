name: Final Android runtime validation

on:
  push:
    paths:
      - '.github/workflows/final-android-runtime.yml'
      - '.github/scripts/prepare-final-source.sh'
      - '.github/final-transform-chunks/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-runtime:
    name: Hardened Android compile + emulator launch
    runs-on: ubuntu-22.04
    env:
      SOURCE_ZIP: GDScript_Lab_v1.0.0_Tauri_Production_Project_FINAL.zip
      SOURCE_GIT_BLOB_SHA1: 43d91956291718bef62f80fb83384316f8e083e9
      PROJECT_DIR: _incoming/GDScript_Lab_Tauri_v1.0.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - uses: actions/setup-node@v4
        with: { node-version: '22.16.0' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.0'
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with: { workspaces: './_incoming/GDScript_Lab_Tauri_v1.0.0/src-tauri -> target' }
      - name: Prepare exact hardened source
        shell: bash
        run: |
          bash .github/scripts/prepare-final-source.sh
          cd "$PROJECT_DIR"
          test "$(sha256sum portable/GDScript_Lab_Godot47_v1.0.0.html | awk '{print $1}')" = '3e36ecee887e85272648fc7658bbd32b22110d659778acae9adccde979c2033f'
          test "$(sha256sum src/index.html | awk '{print $1}')" = 'ba6d7357575002a0ee129b26733f52e9c29d5e64a470e3bf84bd76ca8d306e99'
      - name: Compile hardened APK and AAB
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm run icons
          cargo metadata --format-version 1 --manifest-path src-tauri/Cargo.toml > /dev/null
          npm run android:init
          npm run android:apk
          npm run android:aab
          mkdir -p "$RUNNER_TEMP/android-unsigned"
          find src-tauri/gen/android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print -exec cp {} "$RUNNER_TEMP/android-unsigned/" \;
          test -n "$(find "$RUNNER_TEMP/android-unsigned" -name '*.apk' -print -quit)"
          test -n "$(find "$RUNNER_TEMP/android-unsigned" -name '*.aab' -print -quit)"
          sha256sum "$RUNNER_TEMP/android-unsigned"/* > "$RUNNER_TEMP/android-unsigned/SHA256SUMS.txt"
      - name: Upload exact unsigned compilation outputs
        uses: actions/upload-artifact@v4
        with:
          name: GDScript-Lab-v1.0.0-FINAL-HARDENED-Android-Unsigned
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/android-unsigned/**
      - name: Prepare temporary emulator-only APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$RUNNER_TEMP/android-unsigned" -type f -name '*.apk' -print -quit)"
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/emulator-only.jks" -storepass emulatoronly -keypass emulatoronly -alias emulatoronly -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=CI Emulator Only,O=Temporary QA' >/dev/null 2>&1
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/final-aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/emulator-only.jks" --ks-key-alias emulatoronly --ks-pass pass:emulatoronly --key-pass pass:emulatoronly --out "$RUNNER_TEMP/final-emulator.apk" "$RUNNER_TEMP/final-aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$RUNNER_TEMP/final-emulator.apk"
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Launch hardened APK on Android 35 emulator
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: |
            set -eu
            adb install -r "$RUNNER_TEMP/final-emulator.apk"
            adb logcat -c
            adb shell monkey -p com.jbhprods.gdscriptlab -c android.intent.category.LAUNCHER 1
            sleep 10
            PID="$(adb shell pidof com.jbhprods.gdscriptlab | tr -d '\r')"
            test -n "$PID"
            echo "PASS: hardened Android app process remained alive; PID=$PID"
            adb exec-out screencap -p > final-android-runtime.png
            adb logcat -d -t 500 > final-android-logcat.txt
            if grep -E 'FATAL EXCEPTION|AndroidRuntime.*FATAL|Process: com\.jbhprods\.gdscriptlab.*crash' final-android-logcat.txt; then exit 1; fi
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GDScript-Lab-v1.0.0-FINAL-HARDENED-Android-Runtime-Evidence
          if-no-files-found: warn
          retention-days: 7
          path: |
            final-android-runtime.png
            final-android-logcat.txt
