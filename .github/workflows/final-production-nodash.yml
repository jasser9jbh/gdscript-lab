name: GDScript Lab final no dash production release

on:
  push:
    branches: [uiux-native-final-run-20260902]
    paths:
      - '.github/workflows/final-production-nodash.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gdlab-final-nodash-${{ github.ref }}
  cancel-in-progress: false

env:
  BASE_SOURCE_ARTIFACT_ID: '9831338397'
  PROJECT_DIR: GDScript_Lab_Tauri_v1.0.0
  EXPECTED_FRONTEND_SHA256: 628151d40b067f8ab55da80030862720d319d07f69d62d5b532bfd0fdc311336
  EXPECTED_PORTABLE_SHA256: e9961e8ed86526cff1a51725dd013c4370a159754642f3c6628779202095108d
  EXPECTED_COURSE_SHA256: c0a663fb0cf5cf8876e3279e70d5783d245a615cbf6238cf82a1ad67e1408abe

jobs:
  source:
    name: Normalize and freeze canonical source
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - uses: actions/setup-node@v4
        with: { node-version: '22.16.0' }
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: '1.98.0' }
      - name: Download exact locked canonical source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_SOURCE_ARTIFACT_ID}/zip" \
            -o canonical-source-artifact.zip
          python -m zipfile -e canonical-source-artifact.zip canonical-wrapper
          test -f canonical-wrapper/GDScript_Lab_v1.0.0_FINAL_CANONICAL_SOURCE.zip
          python -m zipfile -e canonical-wrapper/GDScript_Lab_v1.0.0_FINAL_CANONICAL_SOURCE.zip .
          test -s "$PROJECT_DIR/package-lock.json"
          test -s "$PROJECT_DIR/src-tauri/Cargo.lock"
      - name: Normalize Unicode dash punctuation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          root=Path('GDScript_Lab_Tauri_v1.0.0')
          bad='\u2010\u2011\u2012\u2013\u2014\u2015\u2212'
          def norm(t):
              t=t.replace(' — Godot', ': Godot').replace(' — GDScript', ': GDScript')
              for a,b in [
                  ('—for example', ', for example'),('—but', ', but'),('—or', ', or'),('—and', ', and'),
                  ('—not', ', not'),('—including', ', including'),('—in ', ', in '),('—to ', ', to '),
                  ('—no ', ', no '),('—can ', ', can '),('—the ', ': the '),('—signals', ': signals')]:
                  t=t.replace(a,b)
              t=t.replace(' — ', ': ').replace('—', ', ').replace('–','-')
              for c in '\u2010\u2011\u2012\u2015\u2212': t=t.replace(c,'-')
              return t
          for p in root.rglob('*'):
              if not p.is_file(): continue
              try: t=p.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              n=norm(t)
              if n!=t: p.write_text(n,encoding='utf-8')
          front=root/'src/index.html'; portable=root/'portable/GDScript_Lab_Godot47_v1.0.0.html'; audit=root/'scripts/audit.py'
          t=front.read_text('utf-8')
          m=re.search(r'window\.COURSE_DATA\s*=\s*',t)
          if not m: raise SystemExit('COURSE_DATA missing')
          s=m.end(); d=0; ins=False; esc=False; e=None
          for i,ch in enumerate(t[s:],s):
              if ins:
                  if esc: esc=False
                  elif ch=='\\': esc=True
                  elif ch=='"': ins=False
              else:
                  if ch=='"': ins=True
                  elif ch=='{': d+=1
                  elif ch=='}':
                      d-=1
                      if d==0: e=i+1; break
          raw=t[s:e]; data=json.loads(raw)
          ph=hashlib.sha256(portable.read_bytes()).hexdigest(); ch=hashlib.sha256(raw.encode()).hexdigest(); fh=hashlib.sha256(front.read_bytes()).hexdigest()
          a=audit.read_text('utf-8')
          a=re.sub(r"EXPECTED_PORTABLE='[0-9a-f]{64}'",f"EXPECTED_PORTABLE='{ph}'",a)
          a=re.sub(r"EXPECTED_COURSE='[0-9a-f]{64}'",f"EXPECTED_COURSE='{ch}'",a)
          marker="portable=Path('portable/GDScript_Lab_Godot47_v1.0.0.html')\n"
          insert="BAD_DASHES='\\u2010\\u2011\\u2012\\u2013\\u2014\\u2015\\u2212'\nassert not any(c in t for c in BAD_DASHES), 'Unicode dash punctuation found in frontend'\n"
          if 'BAD_DASHES=' not in a: a=a.replace(marker,marker+insert)
          audit.write_text(a,'utf-8')
          check=root/'scripts/no_unicode_dashes_check.py'
          check.write_text("from pathlib import Path\nBAD='\\u2010\\u2011\\u2012\\u2013\\u2014\\u2015\\u2212'\nroot=Path(__file__).resolve().parents[1]\nh=[]\nfor p in root.rglob('*'):\n    if not p.is_file(): continue\n    try:t=p.read_text('utf-8')\n    except UnicodeDecodeError: continue\n    if any(c in t for c in BAD): h.append(str(p.relative_to(root)))\nif h: raise SystemExit('Unicode dash punctuation found: '+', '.join(h))\nprint('PASS: zero Unicode dash punctuation')\n",encoding='utf-8')
          assert fh=='628151d40b067f8ab55da80030862720d319d07f69d62d5b532bfd0fdc311336',fh
          assert ph=='e9961e8ed86526cff1a51725dd013c4370a159754642f3c6628779202095108d',ph
          assert ch=='c0a663fb0cf5cf8876e3279e70d5783d245a615cbf6238cf82a1ad67e1408abe',ch
          assert (len(data['modules']),len(data['lessons']),sum(len(x.get('codes',[])) for x in data['lessons']),len(data['glossary']),len(data['reference']),len(data['projects']))==(27,171,183,310,143,10)
          print('Normalized source hashes and inventory PASS')
          PY
      - name: Audit normalized canonical source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum src/index.html | awk '{print $1}')" = "$EXPECTED_FRONTEND_SHA256"
          test "$(sha256sum portable/GDScript_Lab_Godot47_v1.0.0.html | awk '{print $1}')" = "$EXPECTED_PORTABLE_SHA256"
          python scripts/no_unicode_dashes_check.py
          python scripts/audit.py
          npm ci --ignore-scripts
          cargo metadata --locked --format-version 1 --manifest-path src-tauri/Cargo.toml >/dev/null
          rm -rf node_modules src-tauri/target
      - name: Package normalized source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,zipfile
          root=Path(os.environ['PROJECT_DIR']); out=Path(os.environ['RUNNER_TEMP'])/'GDScript_Lab_v1.0.0_FINAL_PRODUCTION_SOURCE.zip'
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file(): z.write(p,p.relative_to(root.parent))
          print(out)
          PY
          sha256sum "$RUNNER_TEMP/GDScript_Lab_v1.0.0_FINAL_PRODUCTION_SOURCE.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: GDScript-Lab-v1.0.0-FINAL-PRODUCTION-source
          path: ${{ runner.temp }}/GDScript_Lab_v1.0.0_FINAL_PRODUCTION_SOURCE.zip
          if-no-files-found: error
          retention-days: 90

  desktop:
    name: ${{ matrix.name }}
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'Linux x64 AppImage and DEB', os: ubuntu-22.04, target: '', bundles: 'appimage,deb', kind: 'Linux' }
          - { name: 'Windows x64 NSIS and MSI', os: windows-latest, target: '', bundles: 'nsis,msi', kind: 'Windows' }
          - { name: 'macOS Apple Silicon APP and DMG', os: macos-latest, target: 'aarch64-apple-darwin', bundles: 'app,dmg', kind: 'macOS-arm64' }
          - { name: 'macOS Intel APP and DMG', os: macos-latest, target: 'x86_64-apple-darwin', bundles: 'app,dmg', kind: 'macOS-x64' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - uses: actions/download-artifact@v4
        with: { name: GDScript-Lab-v1.0.0-FINAL-PRODUCTION-source, path: source-artifact }
      - name: Extract source
        shell: bash
        run: python -m zipfile -e source-artifact/GDScript_Lab_v1.0.0_FINAL_PRODUCTION_SOURCE.zip .
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils xvfb
      - uses: actions/setup-node@v4
        with: { node-version: '22.16.0' }
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: '1.98.0' }
      - name: Add target
        if: matrix.target != ''
        shell: bash
        run: rustup target add '${{ matrix.target }}'
      - uses: swatinem/rust-cache@v2
        with: { workspaces: './GDScript_Lab_Tauri_v1.0.0/src-tauri -> target' }
      - name: Build locked bundles
        working-directory: GDScript_Lab_Tauri_v1.0.0
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run icons
          python scripts/no_unicode_dashes_check.py
          python scripts/audit.py
          cargo metadata --locked --format-version 1 --manifest-path src-tauri/Cargo.toml >/dev/null
          if [ -n '${{ matrix.target }}' ]; then npm run tauri -- build --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}'; else npm run tauri -- build --bundles '${{ matrix.bundles }}'; fi
      - name: Linux GUI smoke
        if: runner.os == 'Linux'
        working-directory: GDScript_Lab_Tauri_v1.0.0
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find src-tauri/target -type f -name '*.AppImage' -print -quit)"; test -n "$APP"; chmod +x "$APP"
          set +e
          xvfb-run -a env APPIMAGE_EXTRACT_AND_RUN=1 "$APP" > "$RUNNER_TEMP/linux-smoke.log" 2>&1 & PID=$!
          sleep 10
          if kill -0 "$PID" 2>/dev/null; then kill "$PID" || true; wait "$PID" || true; echo 'PASS: Linux GUI smoke'; exit 0; fi
          wait "$PID"; C=$?; cat "$RUNNER_TEMP/linux-smoke.log" || true; exit "$C"
      - name: Windows GUI smoke
        if: runner.os == 'Windows'
        working-directory: GDScript_Lab_Tauri_v1.0.0
        shell: pwsh
        run: |
          $exe=Get-ChildItem src-tauri/target -Recurse -Filter '*.exe' | Where-Object { $_.FullName -match '\\release\\gdscript-lab\.exe$' } | Select-Object -First 1
          if (-not $exe) { throw 'Application executable not found' }
          $p=Start-Process $exe.FullName -PassThru; Start-Sleep 10
          if ($p.HasExited) { throw "Application exited with $($p.ExitCode)" }
          Stop-Process $p.Id -Force
          Write-Output 'PASS: Windows GUI smoke'
      - name: Stage distributable files
        shell: bash
        working-directory: GDScript_Lab_Tauri_v1.0.0
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/release"; mkdir -p "$OUT"
          case '${{ matrix.kind }}' in
            Linux)
              cp "$(find src-tauri/target -type f -name '*.AppImage' -print -quit)" "$OUT/GDScript_Lab_v1.0.0_Linux_x64.AppImage"
              cp "$(find src-tauri/target -type f -name '*.deb' -print -quit)" "$OUT/GDScript_Lab_v1.0.0_Linux_x64.deb";;
            Windows)
              cp "$(find src-tauri/target -type f -path '*/bundle/nsis/*.exe' -print -quit)" "$OUT/GDScript_Lab_v1.0.0_Windows_x64_Setup.exe"
              cp "$(find src-tauri/target -type f -path '*/bundle/msi/*.msi' -print -quit)" "$OUT/GDScript_Lab_v1.0.0_Windows_x64.msi";;
            macOS-arm64)
              cp "$(find src-tauri/target -type f -path '*/bundle/dmg/*.dmg' -print -quit)" "$OUT/GDScript_Lab_v1.0.0_macOS_AppleSilicon.dmg";;
            macOS-x64)
              cp "$(find src-tauri/target -type f -path '*/bundle/dmg/*.dmg' -print -quit)" "$OUT/GDScript_Lab_v1.0.0_macOS_Intel.dmg";;
          esac
          sha256sum "$OUT"/* > "$OUT/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: GDScript-Lab-v1.0.0-FINAL-${{ matrix.kind }}
          path: ${{ runner.temp }}/release/**
          if-no-files-found: error
          retention-days: 90

  ios:
    name: iOS unsigned compile validation
    needs: source
    runs-on: macos-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - uses: actions/download-artifact@v4
        with: { name: GDScript-Lab-v1.0.0-FINAL-PRODUCTION-source, path: source-artifact }
      - run: python -m zipfile -e source-artifact/GDScript_Lab_v1.0.0_FINAL_PRODUCTION_SOURCE.zip .
      - uses: actions/setup-node@v4
        with: { node-version: '22.16.0' }
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: '1.98.0', targets: 'aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim' }
      - name: Install CocoaPods
        run: brew install cocoapods
      - name: Compile unsigned iOS app
        working-directory: GDScript_Lab_Tauri_v1.0.0
        run: |
          set -euo pipefail
          npm ci
          npm run icons
          python scripts/no_unicode_dashes_check.py
          python scripts/audit.py
          cargo metadata --locked --format-version 1 --manifest-path src-tauri/Cargo.toml >/dev/null
          npm run ios:init
          npm run ios:build
          printf '%s\n' 'PASS: iOS unsigned compile completed.' 'A distributable IPA still requires Apple signing and provisioning credentials.' > "$RUNNER_TEMP/IOS_COMPILE_VALIDATION.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: GDScript-Lab-v1.0.0-FINAL-iOS-validation
          path: ${{ runner.temp }}/IOS_COMPILE_VALIDATION.txt
          if-no-files-found: error
          retention-days: 90

  android:
    name: Android signed release and emulator validation
    needs: source
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - uses: actions/download-artifact@v4
        with: { name: GDScript-Lab-v1.0.0-FINAL-PRODUCTION-source, path: source-artifact }
      - run: python -m zipfile -e source-artifact/GDScript_Lab_v1.0.0_FINAL_PRODUCTION_SOURCE.zip .
      - uses: actions/setup-node@v4
        with: { node-version: '22.16.0' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK, NDK and emulator image
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platform-tools' 'emulator' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'system-images;android-35;google_apis;x86_64'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: '1.98.0', targets: 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android' }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: './GDScript_Lab_Tauri_v1.0.0/src-tauri -> target' }
      - name: Build canonical Android APK and AAB
        working-directory: GDScript_Lab_Tauri_v1.0.0
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run icons
          python scripts/no_unicode_dashes_check.py
          python scripts/audit.py
          cargo metadata --locked --format-version 1 --manifest-path src-tauri/Cargo.toml >/dev/null
          npm run android:init
          npm run android:apk
          npm run android:aab
      - name: Sign release with permanent replacement identity
        working-directory: GDScript_Lab_Tauri_v1.0.0
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"; OUT="$RUNNER_TEMP/android-release"; PRIV="$RUNNER_TEMP/android-private"; mkdir -p "$OUT" "$PRIV"
          PASS="$(openssl rand -hex 32)"; ALIAS='gdlab-release'; KS="$PRIV/GDScript_Lab_Android_Release_Keystore.jks"
          keytool -genkeypair -keystore "$KS" -storepass "$PASS" -keypass "$PASS" -alias "$ALIAS" -keyalg RSA -keysize 3072 -sigalg SHA256withRSA -validity 10000 -dname 'CN=GDScript Lab, O=Journey Beyond Horizons Productions (JBH PRODS)' >/dev/null 2>&1
          U="$(find src-tauri/gen/android/app/build/outputs -type f -name '*release-unsigned.apk' -print -quit)"; A="$(find src-tauri/gen/android/app/build/outputs -type f -name '*.aab' -print -quit)"; test -n "$U"; test -n "$A"
          "$BT/zipalign" -f -p 4 "$U" "$OUT/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$ALIAS" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out "$OUT/GDScript_Lab_v1.0.0_Android.apk" "$OUT/aligned.apk"
          rm "$OUT/aligned.apk"
          cp "$A" "$OUT/GDScript_Lab_v1.0.0_Android.aab"
          jarsigner -keystore "$KS" -storepass "$PASS" -keypass "$PASS" -sigalg SHA256withRSA -digestalg SHA-256 "$OUT/GDScript_Lab_v1.0.0_Android.aab" "$ALIAS" >/dev/null
          "$BT/apksigner" verify --verbose --print-certs "$OUT/GDScript_Lab_v1.0.0_Android.apk" | tee "$OUT/APK_SIGNATURE_VERIFICATION.txt"
          jarsigner -verify -verbose -certs "$OUT/GDScript_Lab_v1.0.0_Android.aab" 2>&1 | tee "$OUT/AAB_SIGNATURE_VERIFICATION.txt"
          grep -q 'jar verified' "$OUT/AAB_SIGNATURE_VERIFICATION.txt"
          "$BT/zipalign" -c -v 4 "$OUT/GDScript_Lab_v1.0.0_Android.apk" > "$OUT/APK_ZIPALIGN_VERIFICATION.txt"
          "$BT/aapt" dump badging "$OUT/GDScript_Lab_v1.0.0_Android.apk" > "$OUT/APK_BADGING.txt"
          CERT="$($BT/apksigner verify --print-certs "$OUT/GDScript_Lab_v1.0.0_Android.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          cat > "$OUT/ANDROID_RELEASE_IDENTITY.txt" <<EOF
          GDScript Lab v1.0.0 Android release signing identity
          Certificate SHA-256: $CERT
          Alias: $ALIAS
          This is the permanent replacement identity for the public v1.0.0 release.
          Earlier prerelease APKs signed by certificate 390ef4409a8b6bb7dd99e1ce7e14eb57a46b60aa557101b2ffd4f1fbb7a63064 cannot be updated in place by this build.
          EOF
          cat > "$PRIV/ANDROID_SIGNING_CREDENTIALS.txt" <<EOF
          PRIVATE. STORE SECURELY. DO NOT DISTRIBUTE.
          Product: GDScript Lab
          Alias: $ALIAS
          Keystore password: $PASS
          Key password: $PASS
          Certificate SHA-256: $CERT
          This key must be reused for future Android updates signed outside an app store key management service.
          EOF
          cp "$OUT/ANDROID_RELEASE_IDENTITY.txt" "$PRIV/ANDROID_RELEASE_IDENTITY.txt"
          sha256sum "$OUT"/*.apk "$OUT"/*.aab > "$OUT/SHA256SUMS.txt"
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Launch Android 35 emulator manually and validate runtime
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/android-release"; E="$OUT/runtime-evidence"; mkdir -p "$E"
          echo no | avdmanager create avd --force --name gdlab_api35 --package 'system-images;android-35;google_apis;x86_64' --device 'pixel_6' > "$E/AVD_CREATE.txt" 2>&1
          "$ANDROID_HOME/emulator/emulator" -avd gdlab_api35 -no-window -noaudio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -no-metrics > "$E/EMULATOR_STDOUT.txt" 2>&1 & EMU_PID=$!
          cleanup(){ kill "$EMU_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          adb wait-for-device
          BOOT=''
          for i in $(seq 1 180); do
            BOOT="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            [ "$BOOT" = '1' ] && break
            sleep 2
          done
          [ "$BOOT" = '1' ] || { cat "$E/EMULATOR_STDOUT.txt"; exit 1; }
          adb shell input keyevent 82 || true
          adb install -r "$OUT/GDScript_Lab_v1.0.0_Android.apk" | tee "$E/ADB_INSTALL.txt"
          adb logcat -c
          adb shell monkey -p com.jbhprods.gdscriptlab -c android.intent.category.LAUNCHER 1 | tee "$E/ADB_START.txt"
          sleep 20
          PID="$(adb shell pidof com.jbhprods.gdscriptlab | tr -d '\r\n')"
          printf '%s\n' "$PID" > "$E/PID.txt"
          adb shell dumpsys activity activities > "$E/DUMPSYS_ACTIVITIES.txt" || true
          adb shell dumpsys activity exit-info com.jbhprods.gdscriptlab > "$E/EXIT_INFO.txt" || true
          adb logcat -d -t 1500 > "$E/ANDROID_RUNTIME_LOGCAT.txt" || true
          adb exec-out screencap -p > "$E/ANDROID_RUNTIME_SCREENSHOT.png" || true
          test -n "$PID"
          if grep -E 'FATAL EXCEPTION|AndroidRuntime.*FATAL|Process: com\.jbhprods\.gdscriptlab.*crash' "$E/ANDROID_RUNTIME_LOGCAT.txt" | grep -q 'com.jbhprods.gdscriptlab'; then
            echo 'Package specific fatal runtime signature detected' >&2
            exit 1
          fi
          printf 'PASS: Android process remained alive. PID=%s\n' "$PID" | tee "$E/RESULT.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: GDScript-Lab-v1.0.0-FINAL-Android-signed
          path: ${{ runner.temp }}/android-release/**
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: PRIVATE-GDScript-Lab-v1.0.0-Android-signing-backup
          path: ${{ runner.temp }}/android-private/**
          if-no-files-found: error
          retention-days: 90

  assemble:
    name: Assemble and verify final public release
    needs: [source, desktop, ios, android]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - uses: actions/download-artifact@v4
        with: { name: GDScript-Lab-v1.0.0-FINAL-PRODUCTION-source, path: in/source }
      - uses: actions/download-artifact@v4
        with: { name: GDScript-Lab-v1.0.0-FINAL-Windows, path: in/windows }
      - uses: actions/download-artifact@v4
        with: { name: GDScript-Lab-v1.0.0-FINAL-Linux, path: in/linux }
      - uses: actions/download-artifact@v4
