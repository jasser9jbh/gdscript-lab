      - name: Build release tree, manifest and checksums
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/GDScript_Lab_v1.0.0_FINAL_PRODUCTION_RELEASE"
          mkdir -p "$ROOT"/{Windows,Linux,macOS,Android,iOS,Portable,Source,Branding,Documentation}
          cp in/windows/GDScript_Lab_v1.0.0_Windows_x64_Setup.exe "$ROOT/Windows/"
          cp in/windows/GDScript_Lab_v1.0.0_Windows_x64.msi "$ROOT/Windows/"
          cp in/linux/GDScript_Lab_v1.0.0_Linux_x64.AppImage "$ROOT/Linux/"
          cp in/linux/GDScript_Lab_v1.0.0_Linux_x64.deb "$ROOT/Linux/"
          cp in/mac-arm64/GDScript_Lab_v1.0.0_macOS_AppleSilicon.dmg "$ROOT/macOS/"
          cp in/mac-x64/GDScript_Lab_v1.0.0_macOS_Intel.dmg "$ROOT/macOS/"
          cp in/android/GDScript_Lab_v1.0.0_Android.apk "$ROOT/Android/"
          cp in/android/GDScript_Lab_v1.0.0_Android.aab "$ROOT/Android/"
          cp in/android/APK_SIGNATURE_VERIFICATION.txt in/android/AAB_SIGNATURE_VERIFICATION.txt in/android/APK_ZIPALIGN_VERIFICATION.txt in/android/APK_BADGING.txt in/android/ANDROID_RELEASE_IDENTITY.txt "$ROOT/Android/"
          cp -r in/android/runtime-evidence "$ROOT/Android/Runtime_Evidence"
          cp in/ios/IOS_COMPILE_VALIDATION.txt "$ROOT/iOS/"
          cp in/source/GDScript_Lab_v1.0.0_FINAL_PRODUCTION_SOURCE.zip "$ROOT/Source/"
          python -m zipfile -e in/source/GDScript_Lab_v1.0.0_FINAL_PRODUCTION_SOURCE.zip extracted
          cp extracted/GDScript_Lab_Tauri_v1.0.0/portable/GDScript_Lab_Godot47_v1.0.0.html "$ROOT/Portable/"
          cp extracted/GDScript_Lab_Tauri_v1.0.0/assets/app-icon-1024.png "$ROOT/Branding/GDScript_Lab_Icon_1024.png"
          cat > "$ROOT/README_FIRST.txt" <<'EOF'
          GDScript Lab v1.0.0
          Final production release

          This package contains the portable HTML application, canonical source, Windows, Linux, macOS, Android, and iOS compile validation materials.

          Verified scope:
          Windows and Linux builds are rebuilt from the exact normalized source and pass GUI smoke tests.
          macOS Intel and Apple Silicon DMGs are rebuilt from the same exact source.
          Android APK and AAB are rebuilt, signed with the permanent replacement v1.0.0 identity, and the APK passes Android 35 emulator runtime validation.
          iOS compilation passes, but no distributable IPA is included because Apple signing and provisioning credentials are not available.

          Publisher trust caveats:
          Windows installers are not Authenticode signed with a commercial publisher certificate.
          macOS DMGs are not Developer ID signed or notarized.
          These credential bound limitations do not change the verified application code or course content.

          Typography policy:
          The product source and bundled user facing text contain no Unicode dash punctuation characters.
          EOF
          cat > "$ROOT/Documentation/FINAL_VALIDATION_SUMMARY.md" <<'EOF'
          # GDScript Lab v1.0.0 Final Validation Summary

          The final release is rebuilt from one normalized canonical source with resolved npm and Cargo lockfiles.

          Application inventory: 27 modules, 171 lessons, 183 code examples, 310 glossary entries, 143 reference entries, and 10 projects.

          Platform validation:
          * Windows x64: NSIS and MSI built. GUI smoke passed.
          * Linux x64: AppImage and DEB built. GUI smoke passed.
          * macOS Apple Silicon: DMG built.
          * macOS Intel: DMG built.
          * Android: APK and AAB built and signed. APK runtime passed on an Android 35 x86_64 emulator.
          * iOS: unsigned compile passed. No IPA is included.
          * Portable HTML: included and hash verified.

          Distribution credentials:
          * Android has a permanent replacement v1.0.0 signing identity. The private key is not included in the public release package.
          * Windows Authenticode signing still requires a trusted publisher certificate.
          * macOS Developer ID signing and notarization still require Apple credentials.
          * iOS distribution still requires Apple signing and provisioning credentials.

          Typography validation:
          A fail closed check confirms zero Unicode en dash, em dash, figure dash, horizontal bar, nonbreaking hyphen, and Unicode minus characters in the textual public release payload and canonical source.
          EOF
          cat > "$ROOT/Documentation/RELEASE_CHECKLIST.md" <<'EOF'
          # Release Checklist

          * Canonical source hash verified.
          * Course inventory verified.
          * Backup and restore hardening retained.
          * Dreamcatcher artwork remains embedded without a loose runtime dependency.
          * Light and dark theme scrollbar work retained.
          * Zero Unicode dash punctuation check passed.
          * npm lockfile present.
          * Cargo lockfile present.
          * Windows build completed.
          * Windows GUI smoke passed.
          * Linux build completed.
          * Linux GUI smoke passed.
          * macOS Intel build completed.
          * macOS Apple Silicon build completed.
          * Android APK and AAB built and signed.
          * Android 35 emulator runtime passed.
          * iOS unsigned compile passed.
          * Public release excludes private Android signing material.
          * SHA256SUMS verified.
          EOF
          cat > "$ROOT/Documentation/README_DISTRIBUTION.md" <<'EOF'
          # Distribution Notes

          Windows: distribute the EXE or MSI. A trusted Authenticode certificate is recommended to reduce publisher and SmartScreen warnings.

          Linux: distribute the AppImage for portable desktop use and the DEB for Debian based systems.

          macOS: distribute the matching Intel or Apple Silicon DMG. Developer ID signing and Apple notarization are recommended before broad public distribution.

          Android: distribute the signed APK for direct installation. Use the AAB for stores that accept Android App Bundles. Preserve the separately delivered private signing backup permanently for future updates.

          iOS: this package contains compile validation only. A signed IPA requires an Apple Developer signing identity and provisioning profile.
          EOF
          cat > "$ROOT/Documentation/SOURCE_PROVENANCE.md" <<EOF
          # Source Provenance

          Release source: GDScript_Lab_v1.0.0_FINAL_PRODUCTION_SOURCE.zip
          Frontend SHA256: ${EXPECTED_FRONTEND_SHA256}
          Portable SHA256: ${EXPECTED_PORTABLE_SHA256}
          Course data SHA256: ${EXPECTED_COURSE_SHA256}

          The source was derived from the previously locked canonical v1.0.0 source artifact, then normalized with the release typography rule and audited before any native target was built.
          EOF
          python - "$ROOT" <<'PY'
          from pathlib import Path
          import hashlib,json,sys
          root=Path(sys.argv[1])
          files={}
          for p in sorted(root.rglob('*')):
              if p.is_file(): files[str(p.relative_to(root))]=hashlib.sha256(p.read_bytes()).hexdigest()
          manifest={'product':'GDScript Lab','version':'1.0.0','frontend_sha256':'628151d40b067f8ab55da80030862720d319d07f69d62d5b532bfd0fdc311336','portable_sha256':'e9961e8ed86526cff1a51725dd013c4370a159754642f3c6628779202095108d','course_data_sha256':'c0a663fb0cf5cf8876e3279e70d5783d245a615cbf6238cf82a1ad67e1408abe','inventory':{'modules':27,'lessons':171,'code_examples':183,'glossary':310,'reference':143,'projects':10},'files':files}
          (root/'RELEASE_MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          PY
          (cd "$ROOT" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - name: Fail closed final verification
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/GDScript_Lab_v1.0.0_FINAL_PRODUCTION_RELEASE"
          python - "$ROOT" <<'PY'
          from pathlib import Path
          import hashlib,json,re,sys,zipfile
          root=Path(sys.argv[1]); bad='\u2010\u2011\u2012\u2013\u2014\u2015\u2212'
          required=[
            'Windows/GDScript_Lab_v1.0.0_Windows_x64_Setup.exe','Windows/GDScript_Lab_v1.0.0_Windows_x64.msi',
            'Linux/GDScript_Lab_v1.0.0_Linux_x64.AppImage','Linux/GDScript_Lab_v1.0.0_Linux_x64.deb',
            'macOS/GDScript_Lab_v1.0.0_macOS_AppleSilicon.dmg','macOS/GDScript_Lab_v1.0.0_macOS_Intel.dmg',
            'Android/GDScript_Lab_v1.0.0_Android.apk','Android/GDScript_Lab_v1.0.0_Android.aab','Android/Runtime_Evidence/RESULT.txt',
            'iOS/IOS_COMPILE_VALIDATION.txt','Portable/GDScript_Lab_Godot47_v1.0.0.html','Source/GDScript_Lab_v1.0.0_FINAL_PRODUCTION_SOURCE.zip',
            'README_FIRST.txt','Documentation/FINAL_VALIDATION_SUMMARY.md','Documentation/RELEASE_CHECKLIST.md','Documentation/README_DISTRIBUTION.md','Documentation/SOURCE_PROVENANCE.md','RELEASE_MANIFEST.json','SHA256SUMS.txt']
          for rel in required:
              p=root/rel
              if not p.is_file() or p.stat().st_size==0: raise SystemExit('Missing required file: '+rel)
          for p in root.rglob('*'):
              if not p.is_file(): continue
              if p.suffix.lower() in {'.jks','.keystore','.p12','.pfx','.pem','.key'}: raise SystemExit('Private key material in public release: '+str(p))
              try:t=p.read_text('utf-8')
              except UnicodeDecodeError: continue
              if any(c in t for c in bad): raise SystemExit('Unicode dash punctuation found: '+str(p.relative_to(root)))
          if 'PASS: Android process remained alive.' not in (root/'Android/Runtime_Evidence/RESULT.txt').read_text(): raise SystemExit('Android runtime did not pass')
          sums=(root/'SHA256SUMS.txt').read_text().splitlines()
          for line in sums:
              h,rel=line.split(None,1); rel=rel.lstrip('*').lstrip('./'); p=root/rel
              if hashlib.sha256(p.read_bytes()).hexdigest()!=h: raise SystemExit('Checksum mismatch: '+rel)
          with zipfile.ZipFile(root/'Source/GDScript_Lab_v1.0.0_FINAL_PRODUCTION_SOURCE.zip') as z:
              names=z.namelist()
              for n in names:
                  if n.endswith('/') or n.lower().endswith(('.png','.ico','.icns','.zip')): continue
                  try:t=z.read(n).decode('utf-8')
                  except (UnicodeDecodeError,KeyError): continue
                  if any(c in t for c in bad): raise SystemExit('Unicode dash punctuation in source archive: '+n)
          print('PASS: final public release verified')
          PY
          printf '%s\n' 'PASS: final public release verified.' > "$ROOT/FINAL_VERIFICATION.txt"
          (cd "$ROOT" && sha256sum FINAL_VERIFICATION.txt >> SHA256SUMS.txt)
          python - <<'PY'
          from pathlib import Path
          import os,zipfile
          root=Path(os.environ['RUNNER_TEMP'])/'GDScript_Lab_v1.0.0_FINAL_PRODUCTION_RELEASE'
          out=Path(os.environ['RUNNER_TEMP'])/'GDScript_Lab_v1.0.0_FINAL_PRODUCTION_RELEASE.zip'
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file(): z.write(p,Path(root.name)/p.relative_to(root))
          print(out)
          PY
          unzip -t "$RUNNER_TEMP/GDScript_Lab_v1.0.0_FINAL_PRODUCTION_RELEASE.zip" >/dev/null
          sha256sum "$RUNNER_TEMP/GDScript_Lab_v1.0.0_FINAL_PRODUCTION_RELEASE.zip" | tee "$RUNNER_TEMP/FINAL_RELEASE_ZIP_SHA256.txt"
