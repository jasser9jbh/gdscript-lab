name: GDScript Lab Android v5 legacy workflow (disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Legacy signer retired
    runs-on: ubuntu-22.04
    steps:
      - name: Explain replacement
        shell: bash
        run: |
          cat <<'EOF'
          This legacy workflow is intentionally disabled for production signing.
          It previously generated a new Android keystore per run and uploaded the private signing backup as an Actions artifact.
          That behavior is unsafe for a stable Android update identity and must not be used for public releases.

          Use .github/workflows/release-v1-production-safe.yml instead.
          Production Android signing must use one persistent owner-controlled keystore supplied only through GitHub Actions secrets:
            ANDROID_KEYSTORE_BASE64
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
            ANDROID_STORE_PASSWORD
          The replacement workflow never uploads the private keystore.
          EOF
