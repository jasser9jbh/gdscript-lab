name: GDScript Lab Android final production v5 Windows

on:
  push:
    branches: [uiux-native-final-run-20260902]
    paths:
      - '.github/workflows/final-android-production-v5-windows.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PROJECT_DIR: GDScript_Lab_Tauri_v1.0.0
  EXPECTED_FRONTEND_SHA256: 628151d40b067f8ab55da80030862720d319d07f69d62d5b532bfd0fdc311336
  EXPECTED_PORTABLE_SHA256: e9961e8ed86526cff1a51725dd013c4370a159754642f3c6628779202095108d

jobs:
  android:
    name: Build and sign Android release on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/download-artifact@v4
        with:
          name: GDScript-Lab-v1.0.0-FINAL-PRODUCTION-source
          path: source-artifact
          repository: jasser9jbh/gdscript-lab
          run-id: 33636515186
          github-token: ${{ github.token }}

      - name: Extract and verify exact normalized source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -LiteralPath 'source-artifact/GDScript_Lab_v1.0.0_FINAL_PRODUCTION_SOURCE.zip' -DestinationPath '.' -Force
          $front = (Get-FileHash "$env:PROJECT_DIR/src/index.html" -Algorithm SHA256).Hash.ToLower()
          $portable = (Get-FileHash "$env:PROJECT_DIR/portable/GDScript_Lab_Godot47_v1.0.0.html" -Algorithm SHA256).Hash.ToLower()
          if ($front -ne $env:EXPECTED_FRONTEND_SHA256) { throw "Frontend hash mismatch: $front" }
          if ($portable -ne $env:EXPECTED_PORTABLE_SHA256) { throw "Portable hash mismatch: $portable" }
          Push-Location $env:PROJECT_DIR
          python scripts/no_unicode_dashes_check.py
          python scripts/audit.py
          Pop-Location

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android build SDK and NDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
          "NDK_HOME=$env:ANDROID_HOME\ndk\27.2.12479018" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Get-PSDrive C

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.0'
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './GDScript_Lab_Tauri_v1.0.0/src-tauri -> target'

      - name: Build canonical APK and AAB
        working-directory: GDScript_Lab_Tauri_v1.0.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          npm run icons
          python scripts/audit.py
          cargo metadata --locked --format-version 1 --manifest-path src-tauri/Cargo.toml | Out-Null
          npm run android:init
          npm run android:apk
          npm run android:aab
          Get-PSDrive C

      - name: Sign permanent v1.0.0 Android release identity
        working-directory: GDScript_Lab_Tauri_v1.0.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bt = Join-Path $env:ANDROID_HOME 'build-tools\36.0.0'
          $out = Join-Path $env:RUNNER_TEMP 'android-release'
          $priv = Join-Path $env:RUNNER_TEMP 'android-private'
          New-Item -ItemType Directory -Force -Path $out,$priv | Out-Null

          $bytes = New-Object byte[] 32
          [Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $pass = -join ($bytes | ForEach-Object { $_.ToString('x2') })
          $alias = 'gdlab-release'
          $ks = Join-Path $priv 'GDScript_Lab_Android_Release_Keystore.jks'

          & keytool -genkeypair -keystore $ks -storepass $pass -keypass $pass -alias $alias -keyalg RSA -keysize 3072 -sigalg SHA256withRSA -validity 10000 -dname 'CN=GDScript Lab, O=Journey Beyond Horizons Productions (JBH PRODS)'

          $unsignedApk = Get-ChildItem 'src-tauri/gen/android/app/build/outputs' -Recurse -Filter '*release-unsigned.apk' | Select-Object -First 1
          $aab = Get-ChildItem 'src-tauri/gen/android/app/build/outputs' -Recurse -Filter '*.aab' | Select-Object -First 1
          if (-not $unsignedApk) { throw 'Unsigned APK not found' }
          if (-not $aab) { throw 'AAB not found' }

          $aligned = Join-Path $out 'aligned.apk'
          $apkOut = Join-Path $out 'GDScript_Lab_v1.0.0_Android.apk'
          $aabOut = Join-Path $out 'GDScript_Lab_v1.0.0_Android.aab'
          & (Join-Path $bt 'zipalign.exe') -f -p 4 $unsignedApk.FullName $aligned
          & (Join-Path $bt 'apksigner.bat') sign --ks $ks --ks-key-alias $alias --ks-pass "pass:$pass" --key-pass "pass:$pass" --out $apkOut $aligned
          Remove-Item $aligned -Force
          Copy-Item $aab.FullName $aabOut -Force
          & jarsigner -keystore $ks -storepass $pass -keypass $pass -sigalg SHA256withRSA -digestalg SHA-256 $aabOut $alias

          & (Join-Path $bt 'apksigner.bat') verify --verbose --print-certs $apkOut | Tee-Object -FilePath (Join-Path $out 'APK_SIGNATURE_VERIFICATION.txt')
          & jarsigner -verify -verbose -certs $aabOut 2>&1 | Tee-Object -FilePath (Join-Path $out 'AAB_SIGNATURE_VERIFICATION.txt')
          if (-not (Select-String -Path (Join-Path $out 'AAB_SIGNATURE_VERIFICATION.txt') -Pattern 'jar verified')) { throw 'AAB signature verification failed' }
          & (Join-Path $bt 'zipalign.exe') -c -v 4 $apkOut | Out-File (Join-Path $out 'APK_ZIPALIGN_VERIFICATION.txt') -Encoding utf8
          & (Join-Path $bt 'aapt.exe') dump badging $apkOut | Out-File (Join-Path $out 'APK_BADGING.txt') -Encoding utf8

          $certLine = (& (Join-Path $bt 'apksigner.bat') verify --print-certs $apkOut | Select-String 'Signer #1 certificate SHA-256 digest:' | Select-Object -First 1).Line
          $cert = ($certLine -replace '^.*digest:\s*','').Trim()
          & keytool -exportcert -rfc -keystore $ks -storepass $pass -alias $alias | Out-File (Join-Path $out 'ANDROID_RELEASE_CERTIFICATE.pem') -Encoding ascii

          @"
          GDScript Lab v1.0.0 Android release signing identity
          Certificate SHA-256: $cert
          Alias: $alias
          This is the permanent replacement identity for the public v1.0.0 release.
          Earlier prerelease APKs signed by certificate 390ef4409a8b6bb7dd99e1ce7e14eb57a46b60aa557101b2ffd4f1fbb7a63064 cannot be updated in place by this release.
          "@ | Set-Content -Path (Join-Path $out 'ANDROID_RELEASE_IDENTITY.txt') -Encoding utf8

          @"
          PRIVATE. STORE SECURELY. DO NOT DISTRIBUTE.
          Product: GDScript Lab
          Alias: $alias
          Keystore password: $pass
          Key password: $pass
          Certificate SHA-256: $cert
          This keystore is the permanent Android signing identity for public v1.0.0 and future direct signed updates.
          "@ | Set-Content -Path (Join-Path $priv 'ANDROID_SIGNING_CREDENTIALS.txt') -Encoding utf8
          Copy-Item (Join-Path $out 'ANDROID_RELEASE_IDENTITY.txt') (Join-Path $priv 'ANDROID_RELEASE_IDENTITY.txt')
          Copy-Item (Join-Path $out 'ANDROID_RELEASE_CERTIFICATE.pem') (Join-Path $priv 'ANDROID_RELEASE_CERTIFICATE.pem')

          $apkHash = (Get-FileHash $apkOut -Algorithm SHA256).Hash.ToLower()
          $aabHash = (Get-FileHash $aabOut -Algorithm SHA256).Hash.ToLower()
          @("$apkHash  GDScript_Lab_v1.0.0_Android.apk", "$aabHash  GDScript_Lab_v1.0.0_Android.aab") | Set-Content -Path (Join-Path $out 'SHA256SUMS.txt') -Encoding ascii

      - name: Upload signed Android release
        uses: actions/upload-artifact@v4
        with:
          name: GDScript-Lab-v1.0.0-V5-Android-signed
          path: ${{ runner.temp }}/android-release/**
          if-no-files-found: error
          retention-days: 90

      - name: Upload permanent Android signing backup
        uses: actions/upload-artifact@v4
        with:
          name: PRIVATE-GDScript-Lab-v1.0.0-V5-Android-signing-backup
          path: ${{ runner.temp }}/android-private/**
          if-no-files-found: error
          retention-days: 90
