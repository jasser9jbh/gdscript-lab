name: GDScript Lab v1.0.0 release credential readiness

on:
  push:
    branches:
      - release/v1.0.0-production-finalization
    paths:
      - '.github/workflows/release-credential-readiness.yml'

permissions:
  contents: read

jobs:
  credentials:
    name: Check required release credentials without exposing values
    runs-on: ubuntu-22.04
    steps:
      - name: Check secret presence
        shell: bash
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/credential-readiness.txt"
          : > "$OUT"
          check_group() {
            group="$1"; shift
            missing=()
            for name in "$@"; do
              if [ -z "${!name:-}" ]; then missing+=("$name"); fi
            done
            if [ ${#missing[@]} -eq 0 ]; then
              printf '%s: READY\n' "$group" | tee -a "$OUT"
            else
              printf '%s: NOT READY; missing: %s\n' "$group" "${missing[*]}" | tee -a "$OUT"
            fi
          }
          check_group WINDOWS WINDOWS_CERTIFICATE_BASE64 WINDOWS_CERTIFICATE_PASSWORD
          check_group ANDROID ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_STORE_PASSWORD ANDROID_KEY_PASSWORD
          check_group MACOS MACOS_CERTIFICATE_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_KEYCHAIN_PASSWORD APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY_BASE64
          check_group IOS IOS_CERTIFICATE IOS_CERTIFICATE_PASSWORD IOS_MOBILE_PROVISION APPLE_DEVELOPMENT_TEAM
          cp "$OUT" credential-readiness.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GDScript-Lab-v1.0.0-CREDENTIAL-READINESS
          path: credential-readiness.txt
          if-no-files-found: error
          retention-days: 7
