name: GDScript Lab final UI production rebuild

on:
  push:
    paths:
      - '.github/workflows/ui-maintenance-rebuild-v2.yml'
      - '.github/scripts/harden_backup_restore.py'
      - '.github/uiux-patch-chunks/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_ZIP: GDScript_Lab_v1.0.0_Tauri_Production_Project_FINAL.zip
  SOURCE_GIT_BLOB_SHA1: 43d91956291718bef62f80fb83384316f8e083e9
  PROJECT_DIR: _incoming/GDScript_Lab_Tauri_v1.0.0
  NODE_VERSION: '22.16.0'
  PYTHON_VERSION: '3.13'
  RUST_VERSION: '1.98.0'

jobs:
  source-audit:
    name: Exact final source audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Reconstruct and apply final maintenance transform
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object '${{ env.SOURCE_ZIP }}')" = '${{ env.SOURCE_GIT_BLOB_SHA1 }}'
          rm -rf _incoming && mkdir -p _incoming
          python -m zipfile -e '${{ env.SOURCE_ZIP }}' _incoming
          cat .github/uiux-patch-chunks/part-*.b64 | tr -d '\r\n' | base64 --decode | gzip --decompress > "$RUNNER_TEMP/ui-maintenance.py"
          python "$RUNNER_TEMP/ui-maintenance.py" '${{ env.PROJECT_DIR }}'
          python .github/scripts/harden_backup_restore.py '${{ env.PROJECT_DIR }}'
      - name: Audit exact source and JavaScript
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit.py
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          for rel in ['portable/GDScript_Lab_Godot47_v1.0.0.html','release/GDScript_Lab_v1.0.0_Portable.html','src/index.html']:
              text=Path(rel).read_text(encoding='utf-8')
              scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
              for i,code in enumerate(scripts):
                  p=Path(tempfile.gettempdir())/f'gdlab-{Path(rel).name}-{i}.js'
                  p.write_text(code,encoding='utf-8')
                  subprocess.run(['node','--check',str(p)],check=True)
          print('JavaScript syntax PASS')
          PY
          python - <<'PY'
          import hashlib,re
          from pathlib import Path
          p=Path('portable/GDScript_Lab_Godot47_v1.0.0.html'); s=p.read_text(encoding='utf-8')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='3e36ecee887e85272648fc7658bbd32b22110d659778acae9adccde979c2033f'
          assert hashlib.sha256(Path('src/index.html').read_bytes()).hexdigest()=='ba6d7357575002a0ee129b26733f52e9c29d5e64a470e3bf84bd76ca8d306e99'
          m=re.search(r'const COURSE_DATA\s*=\s*(\{.*?\});\s*\n\s*const APP_VERSION',s,re.S); assert m
          assert hashlib.sha256(m.group(1).encode()).hexdigest()=='569bc1d6e94096f495345274bc5083053e1d5fd9af4262d4549cb08cde6b5880'
          print('Exact frontend and COURSE_DATA hashes PASS')
          PY
      - name: Package exact final source snapshot
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,zipfile
          root=Path('${{ env.PROJECT_DIR }}')
          out=Path(os.environ['RUNNER_TEMP'])/'GDScript_Lab_v1.0.0_FINAL_UI_SOURCE.zip'
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file(): z.write(p,p.relative_to(root.parent))
          print(out)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: GDScript-Lab-v1.0.0-FINAL-UI-source
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/GDScript_Lab_v1.0.0_FINAL_UI_SOURCE.zip

  desktop:
    name: ${{ matrix.name }}
    needs: source-audit
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 AppImage + DEB
            os: ubuntu-22.04
            bundles: appimage,deb
            artifact: GDScript-Lab-v1.0.0-FINAL-Linux-x64
            target: ''
          - name: Windows x64 NSIS + MSI
            os: windows-latest
            bundles: nsis,msi
            artifact: GDScript-Lab-v1.0.0-FINAL-Windows-x64
            target: ''
          - name: macOS Apple Silicon APP + DMG
            os: macos-latest
            bundles: app,dmg
            artifact: GDScript-Lab-v1.0.0-FINAL-macOS-arm64
            target: aarch64-apple-darwin
          - name: macOS Intel APP + DMG
            os: macos-latest
            bundles: app,dmg
            artifact: GDScript-Lab-v1.0.0-FINAL-macOS-x64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Prepare exact final source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object '${{ env.SOURCE_ZIP }}')" = '${{ env.SOURCE_GIT_BLOB_SHA1 }}'
          rm -rf _incoming && mkdir -p _incoming
          python -m zipfile -e '${{ env.SOURCE_ZIP }}' _incoming
          cat .github/uiux-patch-chunks/part-*.b64 | tr -d '\r\n' | base64 --decode | gzip --decompress > "$RUNNER_TEMP/ui-maintenance.py"
          python "$RUNNER_TEMP/ui-maintenance.py" '${{ env.PROJECT_DIR }}'
          python .github/scripts/harden_backup_restore.py '${{ env.PROJECT_DIR }}'
          cd '${{ env.PROJECT_DIR }}' && python scripts/audit.py
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils xvfb
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './_incoming/GDScript_Lab_Tauri_v1.0.0/src-tauri -> target'
      - name: Locked dependencies and build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run icons
          cargo metadata --locked --format-version 1 --manifest-path src-tauri/Cargo.toml > /dev/null
          if [ -n '${{ matrix.target }}' ]; then npm run tauri -- build --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}'; else npm run tauri -- build --bundles '${{ matrix.bundles }}'; fi
      - name: Linux GUI smoke launch
        if: runner.os == 'Linux'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find src-tauri/target -type f -name '*.AppImage' -print -quit)"; test -n "$APP"; chmod +x "$APP"
          set +e; xvfb-run -a env APPIMAGE_EXTRACT_AND_RUN=1 "$APP" > "$RUNNER_TEMP/gdlab-linux-smoke.log" 2>&1 & PID=$!; sleep 10
          if kill -0 "$PID" 2>/dev/null; then kill "$PID" || true; wait "$PID" || true; echo 'Linux GUI smoke PASS'; exit 0; fi
          wait "$PID"; CODE=$?; cat "$RUNNER_TEMP/gdlab-linux-smoke.log" || true; exit "$CODE"
      - name: Windows executable smoke launch
        if: runner.os == 'Windows'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path 'src-tauri/target' -Recurse -Filter '*.exe' | Where-Object { $_.FullName -match '\\release\\gdscript-lab\.exe$' } | Select-Object -First 1
          if (-not $exe) { throw 'Built application executable not found' }
          $p=Start-Process -FilePath $exe.FullName -PassThru; Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "Application exited during smoke window with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force; 'Windows GUI smoke PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ env.PROJECT_DIR }}/src-tauri/target/**/bundle/**/*.AppImage
            ${{ env.PROJECT_DIR }}/src-tauri/target/**/bundle/**/*.deb
            ${{ env.PROJECT_DIR }}/src-tauri/target/**/bundle/**/*.exe
            ${{ env.PROJECT_DIR }}/src-tauri/target/**/bundle/**/*.msi
            ${{ env.PROJECT_DIR }}/src-tauri/target/**/bundle/**/*.dmg

  android:
    name: Android signed APK + AAB
    needs: source-audit
    runs-on: ubuntu-22.04
    env:
      ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Prepare exact final source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object '${{ env.SOURCE_ZIP }}')" = '${{ env.SOURCE_GIT_BLOB_SHA1 }}'
          rm -rf _incoming && mkdir -p _incoming
          python -m zipfile -e '${{ env.SOURCE_ZIP }}' _incoming
          cat .github/uiux-patch-chunks/part-*.b64 | tr -d '\r\n' | base64 --decode | gzip --decompress > "$RUNNER_TEMP/ui-maintenance.py"
          python "$RUNNER_TEMP/ui-maintenance.py" '${{ env.PROJECT_DIR }}'
          python .github/scripts/harden_backup_restore.py '${{ env.PROJECT_DIR }}'
          cd '${{ env.PROJECT_DIR }}' && python scripts/audit.py
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK/NDK
        shell: bash
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './_incoming/GDScript_Lab_Tauri_v1.0.0/src-tauri -> target'
      - name: Require permanent signing identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEY_BASE64"; test -n "$ANDROID_KEY_ALIAS"; test -n "$ANDROID_KEYSTORE_PASSWORD"; test -n "$ANDROID_KEY_PASSWORD"
      - name: Locked dependencies and Android builds
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm ci
          npm run icons
          cargo metadata --locked --format-version 1 --manifest-path src-tauri/Cargo.toml > /dev/null
          npm run android:init
          npm run android:apk
          npm run android:aab
      - name: Sign and verify release artifacts
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"; KEYSTORE="$RUNNER_TEMP/gdlab-upload.jks"; OUT="$RUNNER_TEMP/gdlab-final-android"; mkdir -p "$OUT"
          echo "$ANDROID_KEY_BASE64" | base64 --decode > "$KEYSTORE"
          UNSIGNED_APK="$(find src-tauri/gen/android/app/build/outputs -type f -name '*release-unsigned.apk' -print -quit)"; AAB="$(find src-tauri/gen/android/app/build/outputs -type f -name '*.aab' -print -quit)"; test -n "$UNSIGNED_APK"; test -n "$AAB"
          ALIGNED="$OUT/GDScript_Lab_v1.0.0_Android-aligned.apk"; APK="$OUT/GDScript_Lab_v1.0.0_Android.apk"; BUNDLE="$OUT/GDScript_Lab_v1.0.0_Android.aab"
          "$BT/zipalign" -f -p 4 "$UNSIGNED_APK" "$ALIGNED"; "$BT/zipalign" -c -v 4 "$ALIGNED" > "$OUT/APK_ZIPALIGN_VERIFICATION.txt"
          "$BT/apksigner" sign --ks "$KEYSTORE" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" --key-pass "pass:$ANDROID_KEY_PASSWORD" --out "$APK" "$ALIGNED"; rm -f "$ALIGNED"
          cp "$AAB" "$BUNDLE"; jarsigner -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" -sigalg SHA256withRSA -digestalg SHA-256 "$BUNDLE" "$ANDROID_KEY_ALIAS"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee "$OUT/APK_SIGNATURE_VERIFICATION.txt"
          jarsigner -verify -verbose -certs "$BUNDLE" 2>&1 | tee "$OUT/AAB_SIGNATURE_VERIFICATION.txt"; grep -q 'jar verified' "$OUT/AAB_SIGNATURE_VERIFICATION.txt"
          "$BT/aapt" dump badging "$APK" > "$OUT/APK_BADGING.txt"
          if "$BT/zipalign" -h 2>&1 | grep -q -- '-P'; then "$BT/zipalign" -c -P 16 -v 4 "$APK" > "$OUT/APK_16KB_ZIPALIGN_VERIFICATION.txt"; fi
          sha256sum "$APK" "$BUNDLE" > "$OUT/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: GDScript-Lab-v1.0.0-FINAL-Android-signed
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/gdslab-final-android/**

  ios-compile:
    name: iOS unsigned compile check
    needs: source-audit
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Prepare exact final source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object '${{ env.SOURCE_ZIP }}')" = '${{ env.SOURCE_GIT_BLOB_SHA1 }}'
          rm -rf _incoming && mkdir -p _incoming
          python -m zipfile -e '${{ env.SOURCE_ZIP }}' _incoming
          cat .github/uiux-patch-chunks/part-*.b64 | tr -d '\r\n' | base64 --decode | gzip --decompress > "$RUNNER_TEMP/ui-maintenance.py"
          python "$RUNNER_TEMP/ui-maintenance.py" '${{ env.PROJECT_DIR }}'
          python .github/scripts/harden_backup_restore.py '${{ env.PROJECT_DIR }}'
          cd '${{ env.PROJECT_DIR }}' && python scripts/audit.py
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim
      - name: CocoaPods and locked dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          brew install cocoapods
          npm ci
          npm run icons
          cargo metadata --locked --format-version 1 --manifest-path src-tauri/Cargo.toml > /dev/null
      - name: Unsigned iOS compile
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm run ios:init
          npm run ios:build
